<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pacientes · Hadassa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500&display=swap">
<style>
:root{--bg:#f6ece6;--card:#fffaf7;--tx:#4a3b35;--mut:#8c7a72;--ac:#b8836f;--ln:#e7d3c8;--warn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#24201f;--card:#2f2a28;--tx:#f3e6df;--mut:#b9a499;--ac:#d9a58f;--ln:#443b37;--warn:#fb923c}}
:root[data-theme="dark"]{--bg:#24201f;--card:#2f2a28;--tx:#f3e6df;--mut:#b9a499;--ac:#d9a58f;--ln:#443b37;--warn:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Montserrat,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
header{text-align:center;margin:6px 0 18px}header img{width:104px;height:104px;border-radius:50%;box-shadow:0 4px 18px rgba(184,131,111,.35)}h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin:10px 0 2px}.sub{font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:var(--mut)}.card b:first-child{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;box-shadow:0 2px 10px rgba(120,80,60,.06);padding:14px;margin-bottom:12px}
label{display:block;font-size:.8rem;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:10px}.row>div{flex:1}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;margin-top:12px;width:100%}
.ghost{background:none;color:var(--mut);font-weight:400;width:auto;padding:4px 8px;margin:0;font-size:.85rem}
.p{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.p b{font-size:1.05rem}.mut{color:var(--mut);font-size:.85rem}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--ln)}
.late{color:var(--warn);border-color:var(--warn)}
.hist{margin-top:10px;border-top:1px solid var(--ln);padding-top:6px}
.v{padding:8px 0;border-bottom:1px dashed var(--ln)}
.v:last-child{border:0}
#msg{color:var(--warn);font-size:.9rem}
</style>
</head>

<div id="msg"></div>
<div id="login" class="card" hidden>
  <b>Entrar</b>
  <label>E-mail</label><input id="email" type="email" autocomplete="username">
  <label>Senha</label><input id="pass" type="password" autocomplete="current-password">
  <button id="go">Entrar</button>
</div>
<div id="app" hidden>

<div class="card">
  <b>Novo atendimento</b>
  <label>Nome da paciente</label>
  <input id="name" list="names" autocomplete="off" placeholder="Digite ou escolha uma existente">
  <datalist id="names"></datalist>
  <label>Contato / dados (opcional)</label>
  <input id="info" placeholder="Telefone, observações...">
  <label>Tratamento realizado</label>
  <input id="treat" placeholder="Ex: limpeza de pele">
  <div class="row">
    <div><label>Data do atendimento</label><input id="date" type="date"></div>
    <div><label>Deve retornar em</label><input id="ret" type="date"></div>
  </div>
  <button id="save">Salvar atendimento</button>
</div>

<input id="q" placeholder="Buscar paciente..." style="margin-bottom:12px">
<div id="list"></div>
<button class="ghost" id="out" style="margin:16px auto;display:block">Sair</button></div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyClGGMlEeUoQ4s_mS98IzQhBJzbNEI65K8",authDomain:"hadassa-ae23a.firebaseapp.com",projectId:"hadassa-ae23a",storageBucket:"hadassa-ae23a.firebasestorage.app",messagingSenderId:"1042128413000",appId:"1:1042128413000:web:17cbbd48d0c6ca1bf5537d"});
const auth=getAuth(app),db=getFirestore(app);

const $=id=>document.getElementById(id);
let visits=[],open=null;
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?d.split('-').reverse().join('/'):'—';
$('date').value=today();

function render(){
  const q=$('q').value.trim().toLowerCase();
  const by={};
  visits.forEach(v=>{(by[v.name]=by[v.name]||[]).push(v)});
  $('names').innerHTML=Object.keys(by).sort().map(n=>'<option value="'+n.replace(/"/g,'&quot;')+'">').join('');
  const pts=Object.entries(by).filter(([n])=>n.toLowerCase().includes(q)).map(([n,vs])=>{
    vs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    return {n,vs,next:vs[0].returnDate,info:(vs.find(v=>v.info)||{}).info||''};
  }).sort((a,b)=>(a.next||'9').localeCompare(b.next||'9'));
  const list=$('list');list.innerHTML='';
  if(!pts.length){list.innerHTML='<p class="mut">Nenhuma paciente ainda.</p>';return}
  pts.forEach(p=>{
    const c=document.createElement('div');c.className='card';
    const late=p.next&&p.next<today();
    const head=document.createElement('div');head.className='p';
    const l=document.createElement('div');
    const b=document.createElement('b');b.textContent=p.n;
    const m=document.createElement('div');m.className='mut';m.textContent=p.vs[0].treatment+(p.info?' · '+p.info:'');
    l.append(b,m);
    const t=document.createElement('span');t.className='tag'+(late?' late':'');
    t.textContent=p.next?(late?'Atrasada: ':'Volta ')+fmt(p.next):'Sem retorno';
    head.append(l,t);head.onclick=()=>{open=open===p.n?null:p.n;render()};
    c.append(head);
    if(open===p.n){
      const h=document.createElement('div');h.className='hist';
      p.vs.forEach(v=>{
        const d=document.createElement('div');d.className='v';
        const s=document.createElement('div');s.textContent=fmt(v.date)+' — '+v.treatment;
        const r=document.createElement('div');r.className='mut';r.textContent='Retorno: '+fmt(v.returnDate);
        const x=document.createElement('button');x.className='ghost';x.textContent='Apagar';
        x.onclick=e=>{e.stopPropagation();if(confirm('Apagar este atendimento?'))deleteDoc(doc(db,'visits',v.id))};
        d.append(s,r,x);h.append(d);
      });
      c.append(h);
    }
    list.append(c);
  });
}
$('q').oninput=render;
let unsub=null;
$('save').onclick=async()=>{
  const name=$('name').value.trim(),treat=$('treat').value.trim();
  if(!name||!treat){alert('Preencha o nome e o tratamento.');return}
  try{
    await addDoc(collection(db,'visits'),{name,info:$('info').value.trim(),treatment:treat,date:$('date').value,returnDate:$('ret').value,createdAt:Date.now()});
    $('treat').value='';$('ret').value='';$('info').value='';$('name').value='';$('date').value=today();
  }catch(e){alert('Erro ao salvar. Tente de novo.')}
};
$('go').onclick=async()=>{
  $('msg').textContent='';
  try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value)}
  catch(e){$('msg').textContent='E-mail ou senha incorretos.'}
};
$('out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  $('login').hidden=!!u;$('app').hidden=!u;
  if(unsub){unsub();unsub=null}
  if(u){unsub=onSnapshot(collection(db,'visits'),s=>{visits=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{$('msg').textContent='Erro ao carregar os dados.'})}
  else{visits=[];render()}
});
</script>
</body>
</html>
